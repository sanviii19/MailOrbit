<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="12" fill="#4F46E5"/>
  <!-- Envelope body -->
  <rect x="10" y="18" width="44" height="28" rx="4" fill="white"/>
  <!-- Envelope flap (triangle/V shape) -->
  <polyline points="10,18 32,36 54,18" fill="none" stroke="#4F46E5" stroke-width="3" stroke-linejoin="round"/>
  <!-- Bottom corners lines -->
  <line x1="10" y1="46" x2="24" y2="33" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="46" x2="40" y2="33" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round"/>
</svg>